<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Split dinner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5BFF}a:hover{color:#1F45D6}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: linear-gradient(180deg, #DCE5FF 0px, #EEF2FB 200px, #F2F4F9 360px); color: #1B2236; font-family: 'HarmonyOS Sans', Manrope, system-ui, sans-serif">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 10px 20px; flex-shrink: 0">
<div style="display: flex; align-items: center; gap: 10px"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 3h16a6 6 0 0 1 6 6v10a6 6 0 0 1-6 6H13l-6 5v-5.3A6 6 0 0 1 2 19V9a6 6 0 0 1 6-6z" fill="#2F5BFF"></path><rect x="7" y="8.5" width="8" height="8" rx="2.2" fill="#FFFFFF"></rect><rect x="17.5" y="8.5" width="7.5" height="3.2" rx="1.6" fill="#FFFFFF"></rect><rect x="17.5" y="13.3" width="4.6" height="3.2" rx="1.6" fill="#FF7A45"></rect></svg><span style="font-size: 19px; font-weight: 700; letter-spacing: -0.2px">Harmoniser</span></div>
<button aria-label="Scan a QR code" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.72); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2236" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8"></path><path d="M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8"></path><path d="M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16"></path><path d="M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"></path><path d="M7.5 12h9"></path></svg></button>
</div>

<div style="flex: 1; min-height: 0; margin: 4px 12px 16px; border-radius: 28px; background: rgba(255,255,255,0.94); border: 1px solid rgba(47,91,255,0.12); box-shadow: 0 18px 40px rgba(27,34,54,0.10), 0 1px 2px rgba(27,34,54,0.05); display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px; padding: 12px 10px 12px 14px; border-bottom: 1px solid #E8ECF4; flex-shrink: 0">
<div style="width: 42px; height: 42px; border-radius: 13px; background: #EAF0FF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F5BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-2-1.3-2 1.3-2-1.3-2 1.3-2-1.3-2 1.3z"></path><path d="M9 8.5h6M9 12h6M9 15.5h3.5"></path></svg></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px">
<div style="max-width: 100%; font-size: 17px; font-weight: 700; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Split dinner</div>
<div style="display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px; border-radius: 10px; background: #EEF2FF; color: #2A47C7; font-size: 12px; font-weight: 600; line-height: 16px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2A47C7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.5"></rect><path d="M11 17.5h2"></path></svg><span>Made on your phone · no internet</span></div>
</div>
<button aria-label="Close capsule" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #F1F3F8; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B2236" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">

<div aria-live="polite" style="border-radius: 22px; background: #2F5BFF; color: #FFFFFF; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600">Each person pays</span>
<span style="font-size: 56px; font-weight: 800; line-height: 64px; letter-spacing: -1.5px; font-variant-numeric: tabular-nums">{{each}}</span>
<div style="display: flex; gap: 18px; margin-top: 6px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums"><span>Total {{total}}</span><span>Tip {{tipAmt}}</span></div>
</div>

<div style="border-radius: 20px; background: #F5F7FB; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 16px; border-bottom: 1px solid #E3E7F0">
<label for="bill" style="font-size: 16px; font-weight: 600">Bill</label>
<input id="bill" inputmode="decimal" value="{{bill}}" onChange="{{setBill}}" style="width: 132px; height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid #DCE2EE; background: #FFFFFF; padding: 0 14px; text-align: right; font-size: 18px; font-weight: 700; color: #1B2236; font-variant-numeric: tabular-nums">
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 16px; border-bottom: 1px solid #E3E7F0">
<span style="font-size: 16px; font-weight: 600">People</span>
<div style="display: flex; align-items: center; gap: 6px">
<button aria-label="One person fewer" onClick="{{less}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DCE2EE; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B2236" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span aria-live="polite" style="min-width: 36px; text-align: center; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums">{{people}}</span>
<button aria-label="One person more" onClick="{{more}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DCE2EE; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B2236" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 12px 14px 16px">
<span style="font-size: 16px; font-weight: 600">Tip</span>
<div style="display: flex; gap: 8px">
<sc-for list="{{tips}}" as="tp" hint-placeholder-count="4">
<button aria-pressed="{{tp.pressed}}" onClick="{{tp.pick}}" style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid {{tp.border}}; background: {{tp.bg}}; color: {{tp.ink}}; font-size: 15px; font-weight: 700; cursor: pointer">{{tp.label}}</button>
</sc-for>
</div>
</div>
</div>

<span style="font-size: 13px; font-weight: 500; color: #5B6478">Updates as you type. Each share is rounded to the cent.</span>
</div>

<div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid #E8ECF4; flex-shrink: 0">
<button style="flex: 1; min-width: 0; height: 44px; border-radius: 22px; border: 1px solid #DCE2EE; background: #F5F7FB; display: flex; align-items: center; gap: 8px; padding: 0 16px; color: #5B6478; font-size: 15px; font-weight: 500; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F5BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4L15.5 5.5a2.1 2.1 0 0 1 3 3L8 19z"></path><path d="M13.5 7.5l3 3"></path></svg><span>Change it…</span></button>
<button aria-label="Share capsule" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DCE2EE; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2236" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M8 8l4-4 4 4"></path><path d="M6 12v6.5A1.5 1.5 0 0 0 7.5 20h9a1.5 1.5 0 0 0 1.5-1.5V12"></path></svg></button>
<button aria-label="Add to home screen" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DCE2EE; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2236" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><path d="M16.5 13.5v6M13.5 16.5h6"></path></svg></button>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { bill: '120.00', people: 4, tip: 10 };
  }
  renderVals() {
    const self = this;
    const s = this.state;
    const bill = parseFloat(String(s.bill).replace(',', '.')) || 0;
    const tipAmt = bill * s.tip / 100;
    const total = bill + tipAmt;
    const each = s.people > 0 ? total / s.people : 0;
    return {
      bill: s.bill,
      people: s.people,
      each: each.toFixed(2),
      total: total.toFixed(2),
      tipAmt: tipAmt.toFixed(2),
      setBill: function (e) { self.setState({ bill: e.target.value }); },
      less: function () { self.setState({ people: Math.max(1, s.people - 1) }); },
      more: function () { self.setState({ people: Math.min(50, s.people + 1) }); },
      tips: [0, 10, 15, 20].map(function (t) {
        const on = s.tip === t;
        return {
          label: t + '%',
          pressed: on ? 'true' : 'false',
          bg: on ? '#2F5BFF' : '#FFFFFF',
          ink: on ? '#FFFFFF' : '#1B2236',
          border: on ? '#2F5BFF' : '#DCE2EE',
          pick: function () { self.setState({ tip: t }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
